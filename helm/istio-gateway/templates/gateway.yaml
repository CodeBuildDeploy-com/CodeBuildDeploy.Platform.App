{{- $env := required "env.name is required" .Values.env.name }}
{{- $hostPrefix := ternary "www" $env (eq $env "live") }}
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: codebuilddeploy-{{ $env }}
  annotations:
    networking.istio.io/service-type: ClusterIP
spec:
  gatewayClassName: istio
  listeners:
    - name: https-uk
      hostname: {{ printf "%s.codebuilddeploy.co.uk" $hostPrefix | quote }}
      port: 443
      protocol: HTTPS
      tls:
        mode: Terminate
        certificateRefs:
          - name: cbd-{{ $env }}-ssl-cert
      allowedRoutes:
        namespaces:
          from: Same
    - name: https-com
      hostname: {{ printf "%s.codebuilddeploy.com" $hostPrefix | quote }}
      port: 443
      protocol: HTTPS
      tls:
        mode: Terminate
        certificateRefs:
          - name: cbd-{{ $env }}-ssl-cert
      allowedRoutes:
        namespaces:
          from: Same
