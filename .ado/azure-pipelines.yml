trigger:
  branches:
    include:
    - refs/heads/main
    - refs/heads/release/*

pool:
  vmImage: ubuntu-latest

parameters:
- name: deployDev
  displayName: Deploy to Dev
  type: boolean
  default: false

- name: deployQA
  displayName: Deploy to QA (must Deploy to Dev too)
  type: boolean
  default: false

resources:
  repositories:
  - repository: self
  - repository: subplatform
    type: github
    endpoint: 'CodeBuildDeploy-com'
    name: 'CodeBuildDeploy-com/CodeBuildDeploy.Platform.Subscription'

variables:
- group: CodeBuildDeploy-Global

- template: .ado/variables-infrastructure.yml@subplatform
- template: variables-infrastructure.yml

- template: .ado/variables-build.yml@subplatform
- template: variables-env.yml
  parameters:
    isManual: ${{ variables['build.type.manual'] }}
    isRelease: ${{ variables['build.type.release'] }}
    deployDev: ${{ parameters.deployDev }}
    deployQA: ${{ parameters.deployQA }}

- template: .ado/variables-versioning.yml@subplatform
  parameters:
    buildTypeRelease: ${{ variables['build.type.release'] }}
    majorVersion: 1
    minorVersion: 0

- name: Service.Blogs.NameKebabCase
  value: 'codebuilddeploy-blogs'
- name: Service.Blogs.Version
  value: 1.1.95

- name: Service.Identity.NameKebabCase
  value: 'codebuilddeploy-identity'
- name: Service.Identity.Version
  value: 1.0.52

- name: Service.Web.NameKebabCase
  value: 'codebuilddeploy-web'
- name: Service.Web.Version
  value: 1.1.91

name: $[variables['Build.Number']]

stages:
- stage: Build_Umbrella
  displayName: Build Umbrella
  jobs:
  - job: Init_Vars
    displayName: Init Vars
    steps:
    - checkout: self
      displayName: 'Checkout Repo'

    - bash: |
        echo "build.type.release = $(build.type.release)"
        echo "SourceVersion = $(Build.SourceVersion)"
        echo "SourceVersion.Short = $(Build.SourceVersion.Short)"
        echo "Build Number = $(Build.Number)"
        echo "Version Assembly = $(Version.Assembly)"
        echo "Version File = $(Version.File)"
        echo "Version Informational = $(Version.Informational)"
        echo "Version Major = $(Version.Major)"
        echo "Version Minor = $(Version.Minor)"
        echo "Version Patch = $(Version.Patch)"
        echo "Blogs Service Version = $(Service.Blogs.Version)"
        echo "Identity Service Version = $(Service.Identity.Version)"
        echo "Web Service Version = $(Service.Web.Version)"
      displayName: Output Version

  - ${{ if ne(variables['Build.Reason'], 'PullRequest') }}:
    - job: Tag_Version
      displayName: Tag Version
      dependsOn:
        - Init_Vars
      steps:
      - checkout: self
        displayName: 'Checkout Repo'
        persistCredentials: true

      - script: |
          git tag $(Build.Number)
          git push origin $(Build.Number)
        workingDirectory: $(Build.SourcesDirectory)
        displayName: Tag Version in Git

- ${{ if eq(variables['deploy.dev'], 'true') }}:
  - stage: DeployDev
    displayName: Deploy NonProd Development Platform
    dependsOn:
    - Build_Umbrella
    variables:
    - group: CodeBuildDeploy-NonProd-Dev
    - name: Deploy.PlatformEnv
      value: nonprod
    - ${{ if ne(variables['build.type.release'], 'true') }}:
      - name: Deploy.AppEnvShortCap
        value: Dyn
      - name: Deploy.AppEnvShort
        value: dyn
      - name: Deploy.AppEnv
        value: "dyn-${{ variables['Build.SourceVersion.Short'] }}"
    - ${{ if eq(variables['build.type.release'], 'true') }}:
      - name: Deploy.AppEnvShortCap
        value: Dev
      - name: Deploy.AppEnvShort
        value: dev
      - name: Deploy.AppEnv
        value: dev
    jobs:

    - deployment: ProvisionDev
      displayName: Provision ${{ variables['Deploy.AppEnvShortCap'] }} Environment
      environment: "NonProd-${{ variables['Deploy.AppEnvShortCap'] }}"
      strategy:
        runOnce:
          deploy:
            steps:
            - template: .ado/template-terraform.yml@subplatform
              parameters:
                service_connection: '$(Azure.Subscription.NonProdEnterprise)'
                tenant_id: '$(Azure.TenantId)'
                tfuser_client_id: '$(Azure.Tf.User.ClientId)'
                kubelogin: true
                terraform_work_directory: '$(Build.SourcesDirectory)/terraform'
                tfstate_rg_name: $(Tf.State.NonProdEnterprise.RG)
                tfstate_storage_account_name: $(Tf.State.NonProdEnterprise.SA)
                tfstate_blob_name: $(Tf.State.NonProdEnterprise.Blob)
                tfstate_file_name: '$(Deploy.PlatformEnv)-$(Deploy.AppEnv)'
                spoke_vars_file_name: '$(Deploy.AppEnvShort)'
                additional_command_options: '-var="platform_env=$(Deploy.PlatformEnv)" -var="app_env=$(Deploy.AppEnv)"'

    - deployment: "Deploy_${{ variables['Deploy.AppEnvShortCap'] }}_Blogs"
      displayName: "Deploy Blogs to NonProd-${{ variables['Deploy.AppEnvShortCap'] }}"
      environment: "NonProd-${{ variables['Deploy.AppEnvShortCap'] }}"
      dependsOn: ProvisionDev
      strategy:
        runOnce:
          deploy:
            steps:
            - template: app-deployment.yml
              parameters:
                azureSubscription: '$(Azure.Subscription.NonProdEnterprise)'
                registryName: '$(Acr.Repository.Name)'
                platformEnv: '$(Deploy.PlatformEnv)'
                appEnvShort: "${{ variables['Deploy.AppEnvShort'] }}"
                appEnv: '$(Deploy.AppEnv)'
                kubernetesNamespace: "cbd-${{ variables['Deploy.PlatformEnv'] }}-${{ variables['Deploy.AppEnv'] }}"
                serviceNameKebabCase: '$(Service.Blogs.NameKebabCase)'
                serviceVersion: '$(Service.Blogs.Version)'
                ${{ if eq(variables['Deploy.AppEnv'], 'dev') }}:
                  gatewayName: codebuilddeploy-dev

    - deployment: "Deploy_${{ variables['Deploy.AppEnvShortCap'] }}_Identity"
      displayName: "Deploy Identity to NonProd-${{ variables['Deploy.AppEnvShortCap'] }}"
      environment: "NonProd-${{ variables['Deploy.AppEnvShortCap'] }}"
      dependsOn:
      - ProvisionDev
      - ${{ if eq(variables['Deploy.AppEnv'], 'dev') }}:
        - Deploy_Dev_Blogs
      strategy:
        runOnce:
          deploy:
            steps:
            - template: app-deployment.yml
              parameters:
                azureSubscription: '$(Azure.Subscription.NonProdEnterprise)'
                registryName: '$(Acr.Repository.Name)'
                platformEnv: '$(Deploy.PlatformEnv)'
                appEnvShort: "${{ variables['Deploy.AppEnvShort'] }}"
                appEnv: '$(Deploy.AppEnv)'
                kubernetesNamespace: "cbd-${{ variables['Deploy.PlatformEnv'] }}-${{ variables['Deploy.AppEnv'] }}"
                serviceNameKebabCase: '$(Service.Identity.NameKebabCase)'
                serviceVersion: '$(Service.Identity.Version)'
                ${{ if eq(variables['Deploy.AppEnv'], 'dev') }}:
                  gatewayName: codebuilddeploy-dev
        
    - deployment: "Deploy_${{ variables['Deploy.AppEnvShortCap'] }}_Web"
      displayName: "Deploy Web to NonProd-${{ variables['Deploy.AppEnvShortCap'] }}"
      environment: "NonProd-${{ variables['Deploy.AppEnvShortCap'] }}"
      dependsOn:
      - ProvisionDev
      - ${{ if eq(variables['Deploy.AppEnv'], 'dev') }}:
        - Deploy_Dev_Identity
      strategy:
        runOnce:
          deploy:
            steps:
            - template: app-deployment.yml
              parameters:
                azureSubscription: '$(Azure.Subscription.NonProdEnterprise)'
                registryName: '$(Acr.Repository.Name)'
                platformEnv: '$(Deploy.PlatformEnv)'
                appEnvShort: "${{ variables['Deploy.AppEnvShort'] }}"
                appEnv: '$(Deploy.AppEnv)'
                kubernetesNamespace: "cbd-${{ variables['Deploy.PlatformEnv'] }}-${{ variables['Deploy.AppEnv'] }}"
                serviceNameKebabCase: '$(Service.Web.NameKebabCase)'
                serviceVersion: '$(Service.Web.Version)'
                ${{ if eq(variables['Deploy.AppEnv'], 'dev') }}:
                  gatewayName: codebuilddeploy-dev

    - ${{ if eq(variables['Deploy.AppEnv'], 'dev') }}:
      - deployment: DeployDevGateway
        displayName: Deploy shared Dev Istio gateway
        environment: 'NonProd-Dev'
        dependsOn:
        - Deploy_Dev_Web
        strategy:
          runOnce:
            deploy:
              steps:
              - checkout: self
              - task: AzureCLI@3
                displayName: Verify Dev HTTPRoute handoff
                inputs:
                  azureSubscription: '$(Azure.Subscription.NonProdEnterprise)'
                  scriptType: bash
                  scriptLocation: inlineScript
                  inlineScript: |
                    set -euo pipefail
                    export KUBECONFIG
                    KUBECONFIG=$(mktemp)
                    trap 'rm -f -- "$KUBECONFIG"' EXIT
                    az aks get-credentials --resource-group cbd-nonprod-rg --name cbd-nonprod-aks-cluster --admin --overwrite-existing --file "$KUBECONFIG" --only-show-errors
                    shared_route=$(kubectl -n cbd-nonprod-dev --request-timeout=15s get httproute codebuilddeploy-dev --ignore-not-found -o name)
                    if [[ -z "$shared_route" ]]; then
                      exit 0
                    fi
                    for _ in {1..12}; do
                      if kubectl -n cbd-nonprod-dev --request-timeout=5s get httproute dev-codebuilddeploy-web dev-codebuilddeploy-blogs dev-codebuilddeploy-identity -o json |
                        jq -e '(.items | length) == 3 and all(.items[];
                          .metadata.generation as $generation |
                          any(.status.parents[]?;
                            .parentRef.name == "codebuilddeploy-dev" and
                            ([.conditions[]? | select(.status == "True" and .observedGeneration == $generation) | .type] |
                              contains(["Accepted", "ResolvedRefs"]))))' >/dev/null; then
                        exit 0
                      fi
                      sleep 5
                    done
                    echo "Publish and pin all three app charts with accepted HTTPRoutes before removing the shared route." >&2
                    exit 1
              - task: HelmDeploy@1
                displayName: Deploy shared Dev Istio gateway
                inputs:
                  connectionType: 'Azure Resource Manager'
                  azureSubscription: '$(Azure.Subscription.NonProdEnterprise)'
                  azureResourceGroup: 'cbd-nonprod-rg'
                  kubernetesCluster: 'cbd-nonprod-aks-cluster'
                  useClusterAdmin: true
                  command: 'upgrade'
                  arguments: '--atomic --timeout 450s'
                  install: true
                  namespace: 'cbd-nonprod-dev'
                  releaseName: 'cbd-dev-istio-gateway'
                  chartType: 'FilePath'
                  chartPath: '$(Build.SourcesDirectory)/helm/dev-istio-gateway'

  - ${{ if eq(variables['deploy.prod'], 'true') }}:
    - stage: DeployLive
      displayName: Deploy Prod Live Platform
      dependsOn:
      - DeployDev
      variables:
      - name: Deploy.PlatformEnv
        value: prod
      - name: Deploy.AppEnvShortCap
        value: Live
      - name: Deploy.AppEnvShort
        value: live
      - name: Deploy.AppEnv
        value: live
      jobs:

      - deployment: PromoteLiveArtifacts
        displayName: Promote release artifacts to Prod ACR
        environment: "Prod-${{ variables['Deploy.AppEnvShortCap'] }}"
        strategy:
          runOnce:
            deploy:
              steps:
              - checkout: self
              - task: AzureCLI@3
                displayName: Resolve source registry
                inputs:
                  azureSubscription: '$(Azure.Subscription.NonProdEnterprise)'
                  scriptType: bash
                  scriptLocation: inlineScript
                  inlineScript: |
                    set -euo pipefail
                    registry_id=$(az acr show --name "$SOURCE_REGISTRY" --resource-group cbd-nonprod-rg --query id -o tsv --only-show-errors)
                    subscription_id=$(az account show --query id -o tsv --only-show-errors)
                    test -n "$registry_id"
                    test -n "$subscription_id"
                    echo "##vso[task.setvariable variable=PromotionSourceRegistryId]$registry_id"
                    echo "##vso[task.setvariable variable=PromotionSourceSubscription]$subscription_id"
                env:
                  SOURCE_REGISTRY: $(Acr.Repository.Name)
              - task: AzureCLI@3
                displayName: Import and verify pinned images and charts
                inputs:
                  azureSubscription: '$(Azure.Subscription.ProdPremium)'
                  scriptType: bash
                  scriptLocation: scriptPath
                  scriptPath: '$(Build.SourcesDirectory)/.ado/promote-artifacts.sh'
                env:
                  SOURCE_REGISTRY: $(Acr.Repository.Name)
                  SOURCE_REGISTRY_ID: $(PromotionSourceRegistryId)
                  SOURCE_SUBSCRIPTION: $(PromotionSourceSubscription)
                  TARGET_REGISTRY: $(Acr.Repository.ProdName)
                  TARGET_RESOURCE_GROUP: cbd-prod-rg
                  BLOGS_SERVICE: $(Service.Blogs.NameKebabCase)
                  BLOGS_VERSION: $(Service.Blogs.Version)
                  IDENTITY_SERVICE: $(Service.Identity.NameKebabCase)
                  IDENTITY_VERSION: $(Service.Identity.Version)
                  WEB_SERVICE: $(Service.Web.NameKebabCase)
                  WEB_VERSION: $(Service.Web.Version)

      - deployment: ProvisionLive
        dependsOn: PromoteLiveArtifacts
        displayName: Provision ${{ variables['Deploy.AppEnvShortCap'] }} Environment
        environment: "Prod-${{ variables['Deploy.AppEnvShortCap'] }}"
        strategy:
          runOnce:
            deploy:
              steps:
              - template: .ado/template-terraform.yml@subplatform
                parameters: 
                  service_connection: '$(Azure.Subscription.ProdPremium)'
                  tenant_id: '$(Azure.TenantId)'
                  tfuser_client_id: '$(Azure.Tf.User.ClientId)'
                  kubelogin: true
                  terraform_work_directory: '$(Build.SourcesDirectory)/terraform'
                  tfstate_rg_name: $(Tf.State.ProdPremium.RG)
                  tfstate_storage_account_name: $(Tf.State.ProdPremium.SA)
                  tfstate_blob_name: $(Tf.State.ProdPremium.Blob)
                  tfstate_file_name: '$(Deploy.PlatformEnv)-$(Deploy.AppEnv)'
                  spoke_vars_file_name: '$(Deploy.AppEnvShort)'
                  additional_command_options: '-var="platform_env=$(Deploy.PlatformEnv)" -var="app_env=$(Deploy.AppEnv)"'

      - deployment: "Deploy_${{ variables['Deploy.AppEnvShortCap'] }}_Blogs"
        displayName: "Deploy Blogs to Prod-${{ variables['Deploy.AppEnvShortCap'] }}"
        environment: "Prod-${{ variables['Deploy.AppEnvShortCap'] }}"
        dependsOn:
        - ProvisionLive
        strategy:
          runOnce:
            deploy:
              steps:
              - template: app-deployment.yml
                parameters:
                  azureSubscription: '$(Azure.Subscription.ProdPremium)'
                  registryName: '$(Acr.Repository.ProdName)'
                  platformEnv: '$(Deploy.PlatformEnv)'
                  appEnvShort: "${{ variables['Deploy.AppEnvShort'] }}"
                  appEnv: '$(Deploy.AppEnv)'
                  kubernetesNamespace: "cbd-${{ variables['Deploy.PlatformEnv'] }}-${{ variables['Deploy.AppEnv'] }}"
                  serviceNameKebabCase: '$(Service.Blogs.NameKebabCase)'
                  serviceVersion: '$(Service.Blogs.Version)'

      - deployment: "Deploy_${{ variables['Deploy.AppEnvShortCap'] }}_Identity"
        displayName: "Deploy Identity to Prod-${{ variables['Deploy.AppEnvShortCap'] }}"
        environment: "Prod-${{ variables['Deploy.AppEnvShortCap'] }}"
        dependsOn:
        - ProvisionLive
        strategy:
          runOnce:
            deploy:
              steps:
              - template: app-deployment.yml
                parameters:
                  azureSubscription: '$(Azure.Subscription.ProdPremium)'
                  registryName: '$(Acr.Repository.ProdName)'
                  platformEnv: '$(Deploy.PlatformEnv)'
                  appEnvShort: "${{ variables['Deploy.AppEnvShort'] }}"
                  appEnv: '$(Deploy.AppEnv)'
                  kubernetesNamespace: "cbd-${{ variables['Deploy.PlatformEnv'] }}-${{ variables['Deploy.AppEnv'] }}"
                  serviceNameKebabCase: '$(Service.Identity.NameKebabCase)'
                  serviceVersion: '$(Service.Identity.Version)'
          
      - deployment: "Deploy_${{ variables['Deploy.AppEnvShortCap'] }}_Web"
        displayName: "Deploy Web to Prod-${{ variables['Deploy.AppEnvShortCap'] }}"
        environment: "Prod-${{ variables['Deploy.AppEnvShortCap'] }}"
        dependsOn:
        - ProvisionLive
        strategy:
          runOnce:
            deploy:
              steps:
              - template: app-deployment.yml
                parameters:
                  azureSubscription: '$(Azure.Subscription.ProdPremium)'
                  registryName: '$(Acr.Repository.ProdName)'
                  platformEnv: '$(Deploy.PlatformEnv)'
                  appEnvShort: "${{ variables['Deploy.AppEnvShort'] }}"
                  appEnv: '$(Deploy.AppEnv)'
                  kubernetesNamespace: "cbd-${{ variables['Deploy.PlatformEnv'] }}-${{ variables['Deploy.AppEnv'] }}"
                  serviceNameKebabCase: '$(Service.Web.NameKebabCase)'
                  serviceVersion: '$(Service.Web.Version)'
