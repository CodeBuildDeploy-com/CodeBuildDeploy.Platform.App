parameters:
- name: azureSubscription
  type: string
- name: registryName
  type: string
- name: platformEnv
  type: string
- name: appEnvShort
  type: string
- name: appEnv
  type: string
- name: kubernetesNamespace
  type: string
- name: serviceNameKebabCase
  type: string
- name: serviceVersion
  type: string
- name: gatewayName
  type: string
  default: ''

steps:
- checkout: none

- task: AzureCLI@3
  displayName: ACR Login
  inputs:
    azureSubscription: "${{ parameters.azureSubscription }}"
    scriptType: bash
    scriptLocation: inlineScript
    inlineScript: |
      az acr login --name "${{ parameters.registryName }}"

- task: HelmDeploy@1
  inputs:
    connectionType: 'Azure Resource Manager'
    azureSubscription: "${{ parameters.azureSubscription }}"
    azureResourceGroup: "cbd-${{ parameters.platformEnv }}-rg"
    kubernetesCluster: "cbd-${{ parameters.platformEnv }}-aks-cluster"
    useClusterAdmin: true
    command: 'upgrade'
    arguments: '--timeout 450s'
    install: true
    namespace: "${{ parameters.kubernetesNamespace }}"
    releaseName: "${{ parameters.appEnv }}-${{ parameters.serviceNameKebabCase }}"
    chartType: 'Name'
    chartName: "oci://${{ parameters.registryName }}.azurecr.io/helm/${{ parameters.serviceNameKebabCase }}"
    chartVersion: "${{ parameters.serviceVersion }}"
    overrideValues: |
      env.name=${{ parameters.appEnv }}
      env.shortName=${{ parameters.appEnvShort }}
      imageRegistry=${{ parameters.registryName }}.azurecr.io
      ingress.gatewayName=${{ parameters.gatewayName }}
